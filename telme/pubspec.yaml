name: telme
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  go_router: ^14.2.6
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_phone_direct_caller: ^2.1.1
  timezone: ^0.9.4
  table_calendar: ^3.1.2
  multi_select_flutter: ^4.1.3
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  rxdart: ^0.28.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/auth/
    - assets/images/home/
    - assets/icons/
  
