name: Flutter CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telme/telme

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: telme
        run: cd telmeflutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test
